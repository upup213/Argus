services:
  app:
    build: .
    container_name: sba-app
    ports:
      - "9900:9900"
    depends_on:
      milvus-standalone:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      APP_API_KEY: ${APP_API_KEY}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:*}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-biz}
      FILE_UPLOAD_PATH: /app/uploads
      SESSION_STORE: redis
      MCP_TENCENT_CLS_SSE_ENDPOINT: ${MCP_TENCENT_CLS_SSE_ENDPOINT}
    volumes:
      - app-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9900/milvus/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sba

  redis:
    image: redis:7-alpine
    container_name: sba-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sba

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: sba-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - sba

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: sba-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - sba

  milvus-standalone:
    image: milvusdb/milvus:v2.5.10
    container_name: sba-milvus-standalone
    security_opt:
      - seccomp:unconfined
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - milvus-etcd
      - milvus-minio
    networks:
      - sba

  milvus-attu:
    image: zilliz/attu:v2.5
    container_name: sba-milvus-attu
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: milvus-standalone:19530
    depends_on:
      - milvus-standalone
    networks:
      - sba

networks:
  default:
    name: sba

volumes:
  app-uploads:
  redis-data:
